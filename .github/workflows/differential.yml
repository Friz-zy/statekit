name: differential

# Salt comparison per plans/testing.md + init.md section 26: identical
# scenarios via salt-call --local vs statekit in twin containers, normalized
# comparison, report artifact, auto-issue on failure.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$LABEL" != "differential" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  differential:
    name: diff — ${{ matrix.distro }}
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image_ref: debian@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
          - distro: fedora
            image_ref: fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: resolve pinned Salt version from references/salt.lock
        id: salt
        run: |
          version=$(python3 - <<'PY'
          import re, yaml
          lock = yaml.safe_load(open("references/salt.lock"))
          describe = lock["version"]              # e.g. v3008.2-180-g8b63e70063
          match = re.match(r"v?(\d+\.\d+\.\d+)", describe)
          print(match.group(1) if match else "3007.1")
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build statekit
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/statekit ./cmd/statekit

      - name: run twin-container scenarios
        id: run
        continue-on-error: true
        env:
          SALT_VERSION: ${{ steps.salt.outputs.version }}
        run: |
          chmod +x scripts/differential/run.sh scripts/differential/normalize.py
          mkdir -p artifacts
          scripts/differential/run.sh \
            "${{ matrix.image_ref }}" file user pkg |
            tee artifacts/differential-${{ matrix.distro }}.log

      - name: finalize verdict
        id: verdict
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          DISTRO: ${{ matrix.distro }}
        run: |
          if [ "$RUN_OUTCOME" = "success" ]; then
            echo "verdict=parity" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report-${{ matrix.distro }}
          path: artifacts/
          retention-days: 90

      - name: open tracking issue on mismatch
        if: failure() && steps.verdict.outputs.verdict == 'mismatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTRO: ${{ matrix.distro }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "differential mismatch on $DISTRO (run ${{ github.run_id }})" \
            --label "differential,bug" \
            --body "Salt differential parity failed on **$DISTRO**.

          Run: $RUN_URL
          Report artifact: \`differential-report-$DISTRO\`

          Classification checklist per plans/init.md section 28:
          - [ ] reproduce locally
          - [ ] inspect Salt tests for the scenario
          - [ ] inspect Salt source at the pinned revision
          - [ ] classify (salt-compatible / bug intentionally fixed / undefined / platform-specific / intentional divergence)
          - [ ] record the decision in compatibility metadata" \
            || echo "::warning::issue creation failed (duplicate?)"
