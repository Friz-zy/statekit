kind: state
module: apache_module
source_module: apache_module
path: salt/states/apache_module.py
functions:
    - function: enabled
      source:
        path: salt/states/apache_module.py
        symbol: enabled
      summary: Ensure an Apache module is enabled.
      parameters:
        - name: name
      execution_dependencies:
        - apache.a2enmod
        - apache.check_mod_enabled
    - function: disabled
      source:
        path: salt/states/apache_module.py
        symbol: disabled
      summary: Ensure an Apache module is disabled.
      parameters:
        - name: name
      execution_dependencies:
        - apache.a2dismod
        - apache.a2enmod
        - apache.check_mod_enabled
