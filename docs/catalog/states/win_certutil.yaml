kind: state
module: certutil
source_module: win_certutil
virtual: true
path: salt/states/win_certutil.py
platform_markers:
    - is_windows
functions:
    - function: add_store
      source:
        path: salt/states/win_certutil.py
        symbol: add_store
      summary: Store a certificate to the given certificate store
      parameters:
        - name: name
        - name: store
        - name: saltenv
          default: '"base"'
      execution_dependencies:
        - certutil.add_store
        - certutil.get_cert_serial
        - certutil.get_stored_cert_serials
        - cp.cache_file
      tests:
        - path: tests/pytests/unit/states/test_win_certutil.py
          functions: 4
    - function: del_store
      source:
        path: salt/states/win_certutil.py
        symbol: del_store
      summary: Remove a certificate from the given certificate store
      parameters:
        - name: name
        - name: store
        - name: saltenv
          default: '"base"'
      execution_dependencies:
        - certutil.add_store
        - certutil.del_store
        - certutil.get_cert_serial
        - certutil.get_stored_cert_serials
        - cp.cache_file
      tests:
        - path: tests/pytests/unit/states/test_win_certutil.py
          functions: 4
