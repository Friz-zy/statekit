kind: state
module: apache_site
source_module: apache_site
path: salt/states/apache_site.py
functions:
    - function: enabled
      source:
        path: salt/states/apache_site.py
        symbol: enabled
      summary: Ensure an Apache site is enabled.
      parameters:
        - name: name
      execution_dependencies:
        - apache.a2ensite
        - apache.check_site_enabled
    - function: disabled
      source:
        path: salt/states/apache_site.py
        symbol: disabled
      summary: Ensure an Apache site is disabled.
      parameters:
        - name: name
      execution_dependencies:
        - apache.a2dissite
        - apache.a2ensite
        - apache.check_site_enabled
