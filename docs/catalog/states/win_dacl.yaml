    - function: absent
      source:
        path: salt/states/win_dacl.py
        symbol: absent
      summary: Ensure an ACL does not exist
      parameters:
        - name: name
        - name: objectType
        - name: user
        - name: permission
        - name: acetype
        - name: propagation
      execution_dependencies:
        - win_dacl.add_ace
        - win_dacl.check_ace
        - win_dacl.rm_ace
    - function: inherit
      source:
        path: salt/states/win_dacl.py
        symbol: inherit
      summary: Ensure an object is inheriting ACLs from its parent
      parameters:
        - name: name
        - name: objectType
        - name: clear_existing_acl
          default: "False"
      execution_dependencies:
        - win_dacl.add_ace
        - win_dacl.check_ace
        - win_dacl.check_inheritance
