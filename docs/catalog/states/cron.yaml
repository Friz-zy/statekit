        - cron.rm_job
        - cron.rm_special
        - cron.set_env
        - cron.set_job
        - cron.set_special
        - cron.write_cron_file_verbose
        - file.check_managed
        - file.get_managed
        - file.manage_file
        - file.source_list
        - user.info
