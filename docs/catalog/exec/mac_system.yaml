      source:
        path: salt/modules/mac_system.py
        symbol: _atrun_enabled
      summary: Check to see if atrun is running and enabled on the system
      execution_dependencies:
        - service.list
    - function: _enable_atrun
      source:
        path: salt/modules/mac_system.py
        symbol: _enable_atrun
      summary: Enable and start the atrun daemon
      execution_dependencies:
        - service.enable
        - service.list
        - service.start
    - function: _execute_command
      source:
        path: salt/modules/mac_system.py
        symbol: _execute_command
      summary: Helper function to execute the command
      parameters:
        - name: cmd
        - name: at_time
          default: None
      execution_dependencies:
        - cmd.retcode
        - service.enable
        - service.list
        - service.start
