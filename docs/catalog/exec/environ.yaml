kind: exec
module: environ
source_module: environ
path: salt/modules/environ.py
platform_markers:
    - is_windows
functions:
    - function: setval
      source:
        path: salt/modules/environ.py
        symbol: setval
      summary: Set a single salt process environment variable. Returns True
      parameters:
        - name: key
        - name: val
        - name: false_unsets
          default: "False"
        - name: permanent
          default: "False"
      utility_dependencies:
        - reg.delete_value
        - reg.set_value
        - win_functions.broadcast_setting_change
      tests:
        - path: tests/pytests/unit/modules/test_environ.py
          functions: 9
    - function: setenv
      source:
        path: salt/modules/environ.py
        symbol: setenv
      summary: Set multiple salt process environment variables from a dict.
      parameters:
        - name: environ
        - name: false_unsets
          default: "False"
        - name: clear_all
          default: "False"
        - name: update_minion
          default: "False"
        - name: permanent
          default: "False"
      execution_dependencies:
        - event.fire
      utility_dependencies:
