      parameters:
        - name: name
        - name: |-
            # Salt_id for created VM
                cwd
          default: None
        - name: |-
            # path to find Vagrantfile
                machine
          default: '""'
        - name: |-
            # name of machine in Vagrantfile
                runas
          default: None
        - name: |-
            # username who owns Vagrant box
                start
          default: "False"
        - name: |-
            # start the machine when initialized
                vagrant_provider
          default: '""'
        - name: |-
            # vagrant provider (default=virtualbox)
                vm
          default: None
        - name: '# a dictionary of VM configuration settings'
