kind: exec
module: group
source_module: aix_group
virtual: true
path: salt/modules/aix_group.py
functions:
    - function: add
      source:
        path: salt/modules/aix_group.py
        symbol: add
      summary: Add the specified group
      parameters:
        - name: name
        - name: gid
          default: None
        - name: system
          default: "False"
        - name: root
          default: None
        - name: kwargs
          kind: '**'
      execution_dependencies:
        - cmd.run_all
        - group.info
    - function: delete
      source:
        path: salt/modules/aix_group.py
        symbol: delete
      summary: Remove the named group
      parameters:
        - name: name
      execution_dependencies:
        - cmd.run_all
        - group.info
    - function: info
      source:
        path: salt/modules/aix_group.py
        symbol: info
      summary: Return information about a group
      parameters:
        - name: name
      execution_dependencies:
        - cmd.run_all
        - group.info
    - function: getent
      source:
        path: salt/modules/aix_group.py
        symbol: getent
      summary: Return info on all groups
      parameters:
        - name: refresh
          default: "False"
      execution_dependencies:
        - cmd.run_all
        - group.info
    - function: chgid
      source:
        path: salt/modules/aix_group.py
        symbol: chgid
      summary: Change the gid for a named group
      parameters:
        - name: name
        - name: gid
      execution_dependencies:
        - cmd.run
        - cmd.run_all
        - file.group_to_gid
        - group.info
    - function: adduser
      source:
        path: salt/modules/aix_group.py
        symbol: adduser
      summary: Add a user in the group.
      parameters:
        - name: name
        - name: username
        - name: root
          default: None
      execution_dependencies:
        - cmd.retcode
        - cmd.run
        - cmd.run_all
        - file.group_to_gid
        - group.info
    - function: deluser
      source:
        path: salt/modules/aix_group.py
        symbol: deluser
      summary: Remove a user from the group.
      parameters:
        - name: name
        - name: username
        - name: root
          default: None
      execution_dependencies:
        - cmd.retcode
        - cmd.run
        - cmd.run_all
        - file.group_to_gid
        - group.info
    - function: members
      source:
        path: salt/modules/aix_group.py
        symbol: members
      summary: Replaces members of the group with a provided list.
      parameters:
        - name: name
        - name: members_list
        - name: root
          default: None
      execution_dependencies:
        - cmd.retcode
        - cmd.run
        - cmd.run_all
        - file.group_to_gid
        - group.info
