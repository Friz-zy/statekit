      source:
        path: salt/modules/dummyproxy_pkg.py
        symbol: installed
      parameters:
        - name: name
        - name: version
          default: None
        - name: refresh
          default: "False"
        - name: fromrepo
          default: None
        - name: skip_verify
          default: "False"
        - name: pkgs
          default: None
        - name: sources
          default: None
        - name: kwargs
          kind: '**'
