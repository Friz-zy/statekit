        path: salt/modules/dummyproxy_pkg.py
        symbol: install
      parameters:
        - name: name
          default: None
        - name: refresh
          default: "False"
        - name: fromrepo
          default: None
        - name: pkgs
          default: None
        - name: sources
          default: None
        - name: kwargs
          kind: '**'
