kind: exec
module: win_snmp
source_module: win_snmp
virtual: true
path: salt/modules/win_snmp.py
platform_markers:
    - is_windows
functions:
    - function: get_agent_service_types
      source:
        path: salt/modules/win_snmp.py
        symbol: get_agent_service_types
      summary: Get the sysServices types that can be configured.
      utility_dependencies:
        - reg.key_exists
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: get_permission_types
      source:
        path: salt/modules/win_snmp.py
        symbol: get_permission_types
      summary: Get the permission types that can be configured for communities.
      utility_dependencies:
        - reg.key_exists
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: get_agent_settings
      source:
        path: salt/modules/win_snmp.py
        symbol: get_agent_settings
      summary: Determine the value of the SNMP sysContact, sysLocation, and sysServices
      utility_dependencies:
        - reg.key_exists
        - reg.read_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: set_agent_settings
      source:
        path: salt/modules/win_snmp.py
        symbol: set_agent_settings
      summary: Manage the SNMP sysContact, sysLocation, and sysServices settings.
      parameters:
        - name: contact
          default: None
        - name: location
          default: None
        - name: services
          default: None
      utility_dependencies:
        - reg.key_exists
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: get_auth_traps_enabled
      source:
        path: salt/modules/win_snmp.py
        symbol: get_auth_traps_enabled
      summary: Determine whether the host is configured to send authentication traps.
      utility_dependencies:
        - reg.key_exists
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: set_auth_traps_enabled
      source:
        path: salt/modules/win_snmp.py
        symbol: set_auth_traps_enabled
      summary: Manage the sending of authentication traps.
      parameters:
        - name: status
          default: "True"
      utility_dependencies:
        - reg.key_exists
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: get_community_names
      source:
        path: salt/modules/win_snmp.py
        symbol: get_community_names
      summary: Get the current accepted SNMP community names and their permissions.
      utility_dependencies:
        - reg.key_exists
        - reg.list_values
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
    - function: set_community_names
      source:
        path: salt/modules/win_snmp.py
        symbol: set_community_names
      summary: Manage the SNMP accepted community names and their permissions.
      parameters:
        - name: communities
      utility_dependencies:
        - reg.delete_value
        - reg.key_exists
        - reg.list_values
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_win_snmp.py
          functions: 8
