kind: exec
module: autoruns
source_module: win_autoruns
virtual: true
path: salt/modules/win_autoruns.py
platform_markers:
    - is_windows
functions:
    - function: _get_dirs
      source:
        path: salt/modules/win_autoruns.py
        symbol: _get_dirs
      summary: Return a list of startup dirs
      parameters:
        - name: user_dir
        - name: startup_dir
      tests:
        - path: tests/pytests/unit/modules/test_win_autoruns.py
          functions: 1
    - function: list_
      source:
        path: salt/modules/win_autoruns.py
        symbol: list_
      summary: Get a list of automatically running programs
      execution_dependencies:
        - cmd.run
      tests:
        - path: tests/pytests/unit/modules/test_win_autoruns.py
          functions: 1
