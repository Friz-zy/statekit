kind: exec
module: apf
source_module: apf
path: salt/modules/apf.py
functions:
    - function: _status_apf
      source:
        path: salt/modules/apf.py
        symbol: _status_apf
      summary: Return True if apf is running otherwise return False
      execution_dependencies:
        - cmd.run_all
    - function: running
      source:
        path: salt/modules/apf.py
        symbol: running
      summary: Check apf status
      execution_dependencies:
        - cmd.run_all
    - function: disable
      source:
        path: salt/modules/apf.py
        symbol: disable
      summary: Stop (flush) all firewall rules
      execution_dependencies:
        - cmd.run_all
    - function: enable
      source:
        path: salt/modules/apf.py
        symbol: enable
      summary: Load all firewall rules
      execution_dependencies:
        - cmd.run_all
    - function: reload
      source:
        path: salt/modules/apf.py
        symbol: reload
      summary: Stop (flush) & reload firewall rules
      execution_dependencies:
        - cmd.run_all
    - function: refresh
      source:
        path: salt/modules/apf.py
        symbol: refresh
      summary: Refresh & resolve dns names in trust rules
      execution_dependencies:
        - cmd.run_all
    - function: allow
      source:
        path: salt/modules/apf.py
        symbol: allow
      summary: Add host (IP/FQDN) to allow_hosts.rules and immediately load new rule into firewall
      parameters:
        - name: ip
        - name: port
          default: None
      execution_dependencies:
        - cmd.run_all
    - function: deny
      source:
        path: salt/modules/apf.py
        symbol: deny
      summary: Add host (IP/FQDN) to deny_hosts.rules and immediately load new rule into firewall
      parameters:
        - name: ip
      execution_dependencies:
        - cmd.run_all
    - function: remove
      source:
        path: salt/modules/apf.py
        symbol: remove
      summary: Remove host from [glob]*_hosts.rules and immediately remove rule from firewall
      parameters:
        - name: ip
      execution_dependencies:
        - cmd.run_all
