kind: exec
module: macdefaults
source_module: macdefaults
virtual: true
path: salt/modules/macdefaults.py
platform_markers:
    - is_darwin
functions:
    - function: write
      source:
        path: salt/modules/macdefaults.py
        symbol: write
      summary: Write a default to the system
      parameters:
        - name: domain
        - name: key
        - name: value
        - name: vtype
          default: None
        - name: user
          default: None
        - name: key_separator
          default: None
        - name: dict_merge
          default: "False"
        - name: array_add
          default: "False"
        - name: type
          default: None
      tests:
        - path: tests/pytests/unit/modules/test_macdefaults.py
          functions: 34
