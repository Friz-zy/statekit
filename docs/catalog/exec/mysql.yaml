        Salt-compatible aggregate result; no Salt fileserver/cache expansion is
        performed. The whole operation allows at most 256 statements, 10000
        positive returned/affected rows, 100000 result items, and 8 MiB of
        compact-JSON statement results, with one 30-second deadline. Only
        space, tab, LF, CR, and form feed are permitted SQL control whitespace;
        limit, cancellation, and deadline failures return no partial aggregate.
