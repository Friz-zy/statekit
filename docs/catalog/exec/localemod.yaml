        - cmd.run
        - file.file_exists
        - file.replace
        - file.touch
        - locale.list_avail
      tests:
        - path: tests/unit/modules/test_localemod.py
          functions: 0
    - function: gen_locale
      source:
        path: salt/modules/localemod.py
        symbol: gen_locale
      summary: 'Generate a locale. Options:'
      parameters:
        - name: locale
        - name: kwargs
          kind: '**'
      execution_dependencies:
        - cmd.retcode
        - cmd.run
        - cmd.run_all
        - file.file_exists
        - file.replace
        - file.search
