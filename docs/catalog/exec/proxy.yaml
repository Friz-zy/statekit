kind: exec
module: proxy
source_module: proxy
virtual: true
path: salt/modules/proxy.py
platform_markers:
    - is_darwin
    - is_windows
functions:
    - function: _get_proxy_osx
      source:
        path: salt/modules/proxy.py
        symbol: _get_proxy_osx
      parameters:
        - name: cmd_function
        - name: network_service
      execution_dependencies:
        - cmd.run
      tests:
        - path: tests/pytests/unit/modules/test_proxy.py
          functions: 18
    - function: _set_proxy_osx
      source:
        path: salt/modules/proxy.py
        symbol: _set_proxy_osx
      parameters:
        - name: cmd_function
        - name: server
        - name: port
        - name: user
        - name: password
        - name: network_service
      execution_dependencies:
        - cmd.run
      tests:
        - path: tests/pytests/unit/modules/test_proxy.py
          functions: 18
    - function: _get_proxy_windows
      source:
        path: salt/modules/proxy.py
        symbol: _get_proxy_windows
      parameters:
        - name: types
          default: None
      execution_dependencies:
        - cmd.run
      utility_dependencies:
        - reg.read_value
      tests:
        - path: tests/pytests/unit/modules/test_proxy.py
          functions: 18
    - function: _set_proxy_windows
      source:
        path: salt/modules/proxy.py
        symbol: _set_proxy_windows
      parameters:
        - name: server
        - name: port
        - name: types
          default: None
        - name: bypass_hosts
          default: None
        - name: import_winhttp
          default: "True"
      execution_dependencies:
        - cmd.run
      utility_dependencies:
        - reg.read_value
        - reg.set_value
      tests:
        - path: tests/pytests/unit/modules/test_proxy.py
          functions: 18
    - function: get_http_proxy
      source:
        path: salt/modules/proxy.py
        symbol: get_http_proxy
      summary: Returns the current http proxy settings
      parameters:
        - name: network_service
          default: '"Ethernet"'
      execution_dependencies:
        - cmd.run
      utility_dependencies:
        - reg.read_value
        - reg.set_value
      tests:
